# Install only after the enotdev.su certificate exists.
server {
    listen 80;
    server_name enotdev.su;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://enotdev.su$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name enotdev.su;
    ssl_certificate /etc/letsencrypt/live/enotdev.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enotdev.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /socket.io/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $enotdev_chat_backend enotdev-chat:3001;
        proxy_pass http://$enotdev_chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $enotdev_backend enotdev:3000;
        proxy_pass http://$enotdev_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}